[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:zabbix-agent2]
command=/usr/sbin/zabbix_agent2 -f -c /etc/zabbix/zabbix_agent2.conf
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:squid]
command=/bin/bash -lc "mkdir -p /run/squid && chown proxy:proxy /run/squid && exec /usr/sbin/squid -N -f /etc/squid/squid.conf"
autorestart=false
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
